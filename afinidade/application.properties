spring.application.name=afinidade
server.address=127.0.0.1
server.port=8080

# Servidor TCP e endereco usado pelo cliente.
music.tcp.host=127.0.0.1
music.tcp.port=9090
music.tcp.workers=32
music.tcp.queue-capacity=64
music.tcp.timeout-ms=15000
music.server.host=127.0.0.1
music.server.port=${music.tcp.port}
music.server.connect-timeout-ms=3000
music.server.read-timeout-ms=10000

# Avaliacoes persistidas em um unico banco local.
spring.datasource.url=jdbc:h2:file:./data/afinidade;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=8
spring.jackson.deserialization.accept-float-as-int=false
